<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENGL111 Midterm Grammar Review</title>
  <style>
    :root{
      --garnet:#8A1538;
      --garnet-dark:#5f0f28;
      --garnet-soft:#e8e1da;
      --cream:#f7f3ee;
      --ink:#2b2226;
      --muted:#6d5c64;
      --correct:#127c56;
      --wrong:#b3261e;
      --card:#ffffff;
      --shadow:0 10px 30px rgba(88,15,43,.16);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #f7f3ee, #e4ddd5);
      color:var(--ink);
      min-height:100vh;
    }
    .app{max-width:860px;margin:0 auto;padding:18px;}
    header{
      background:linear-gradient(135deg,var(--garnet),var(--garnet-dark));
      color:white;border-radius:var(--radius);padding:22px 18px;
      box-shadow:var(--shadow);margin-bottom:16px;
    }
    h1{font-size:clamp(1.55rem,5vw,2.5rem);margin:0 0 8px;line-height:1.05;}
    header p{margin:0;opacity:.92;font-size:.98rem;}
    .card{
      background:var(--card);border-radius:var(--radius);padding:16px;
      box-shadow:var(--shadow);margin-bottom:16px;
    }
    .grid{display:grid;grid-template-columns: repeat(auto-fit,minmax(160px,1fr));gap:10px;}
    button, select, input{font:inherit;}
    button{
      border:0;border-radius:16px;padding:12px 14px;background:var(--garnet);
      color:white;cursor:pointer;font-weight:700;min-height:46px;transition:transform .06s ease;
    }
    button:active{transform:scale(.97);}
    button.secondary{background:var(--garnet-soft);color:var(--garnet-dark);}
    button.ghost{background:#f4f0f1;color:var(--ink);}
    button:disabled{opacity:.55;cursor:not-allowed;}
    select, input[type="text"]{
      width:100%;border:2px solid #ead5dd;border-radius:16px;padding:12px 14px;
      background:white;color:var(--ink);min-height:46px;
    }
    label{display:block;color:var(--muted);font-size:.88rem;font-weight:700;margin-bottom:6px;}
    .stats{display:grid;grid-template-columns: repeat(4,1fr);gap:8px;margin:12px 0;}
    .stat{background:#fff7f9;border:1px solid #edd1db;border-radius:16px;padding:10px 8px;text-align:center;}
    .stat strong{display:block;color:var(--garnet-dark);font-size:1.2rem;}
    .stat span{font-size:.78rem;color:var(--muted);}

    .ring-wrap{position:relative;width:104px;height:104px;margin:8px auto 2px;}
    .ring{transform:rotate(-90deg);display:block;}
    .ring-track{fill:none;stroke:#ead5dd;stroke-width:10;}
    .ring-fill{fill:none;stroke:var(--garnet);stroke-width:10;stroke-linecap:round;
      stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .4s ease;}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .ring-center strong{font-size:1.5rem;color:var(--garnet-dark);line-height:1;}
    .ring-center span{font-size:.62rem;color:var(--muted);margin-top:2px;letter-spacing:.02em;}

    .question-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:10px;}
    .badge{display:inline-block;background:var(--garnet-soft);color:var(--garnet-dark);padding:6px 10px;border-radius:99px;font-weight:800;font-size:.78rem;}
    .question{font-size:1.25rem;font-weight:800;line-height:1.35;margin:10px 0 16px;}
    .choices{display:grid;gap:10px;}
    .choice{width:100%;text-align:left;background:#faf7f8;color:var(--ink);border:2px solid #ead5dd;font-weight:700;}
    .choice:hover{border-color:var(--garnet);}
    .choice.sel{border-color:var(--garnet);background:#fdeef3;}
    .choice.correct{border-color:var(--correct);background:#e7f5ef;color:#064b32;}
    .choice.wrong{border-color:var(--wrong);background:#fff0ee;color:#6e160f;}
    .choice:disabled{opacity:1;cursor:default;}
    .fb-mark{font-weight:900;font-size:1.15rem;}
    .fb-line{margin-bottom:2px;}
    .feedback{margin-top:14px;padding:13px;border-radius:16px;display:none;line-height:1.45;}
    .feedback.correct{display:block;background:#e7f5ef;color:#064b32;border:1px solid #b7e2d1;}
    .feedback.wrong{display:block;background:#fff0ee;color:#6e160f;border:1px solid #f1b7b2;}
    .praise{font-size:1.05rem;font-weight:800;}
    .arabic{direction:rtl;text-align:right;font-family:"Tahoma","Arial",sans-serif;margin-top:6px;font-weight:700;font-size:1.05rem;line-height:1.6;}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
    .hidden{display:none!important}
    .small{color:var(--muted);font-size:.9rem;line-height:1.4;}
    #mistakesInfo{margin:6px 0 0;font-weight:700;color:var(--garnet-dark);}
    .review-list{padding-left:18px;}
    .review-list li{margin:8px 0;}

    .order-wrap{display:grid;gap:14px;}
    .section-label{font-weight:800;color:var(--muted);font-size:.82rem;margin-bottom:6px;}
    .slot-list,.pool-list{display:grid;gap:8px;}
    .order-slot{border:2px dashed #d9c2cb;border-radius:14px;padding:8px 12px;min-height:48px;display:flex;align-items:center;gap:10px;background:#fbf7f9;}
    .order-slot .num{font-weight:800;color:var(--garnet);min-width:20px;text-align:center;}
    .order-slot .filled{flex:1;text-align:left;background:#fff;border:2px solid #ead5dd;border-radius:12px;padding:8px 10px;font-weight:600;cursor:pointer;}
    .order-slot .empty{flex:1;color:#b7a3ab;font-style:italic;font-size:.9rem;}
    .order-slot.correct .filled{border-color:var(--correct);background:#e7f5ef;}
    .order-slot.wrong .filled{border-color:var(--wrong);background:#fff0ee;}
    .pool-item{background:#faf7f8;color:var(--ink);border:2px solid #ead5dd;border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:600;text-align:left;width:100%;}
    .pool-item:hover{border-color:var(--garnet);}

    .match-wrap{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:start;}
    .match-col{display:grid;gap:8px;}
    .match-item{border:2px solid #ead5dd;border-radius:14px;padding:10px 12px;background:#faf7f8;cursor:pointer;font-weight:600;text-align:center;position:relative;}
    .match-left{text-align:left;padding-right:34px;}
    .match-item.sel{border-color:var(--garnet);background:#fdeef3;}
    .match-item.done{cursor:default;}
    .match-item .tag{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--garnet);color:#fff;font-size:.72rem;font-weight:800;text-align:center;}
    .match-left .tag{position:absolute;right:10px;top:50%;transform:translateY(-50%);}
    .match-item.correct{border-color:var(--correct);background:#e7f5ef;}
    .match-item.wrong{border-color:var(--wrong);background:#fff0ee;}

    #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none;}

    .type-hint{margin:0 0 10px;color:var(--garnet-dark);font-size:.95rem;font-weight:800;text-align:center;background:#fff7f9;border:1px solid #edd1db;border-radius:12px;padding:9px 10px;}
    .type-input{width:100%;border:2px solid #ead5dd;border-radius:16px;padding:14px 16px;font-size:1.15rem;font-weight:700;color:var(--ink);background:#fff;}
    .type-input:focus{outline:none;border-color:var(--garnet);}
    .type-input.correct{border-color:var(--correct);background:#e7f5ef;color:#064b32;}
    .type-input.wrong{border-color:var(--wrong);background:#fff0ee;color:#6e160f;}

    .sort-wrap{display:grid;gap:12px;}
    .sort-hint{font-size:.85rem;color:var(--muted);text-align:center;}
    .sort-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:8px;}
    .sort-cols{display:grid;gap:10px;}
    .sort-cols.cols-2{grid-template-columns:1fr 1fr;}
    .sort-cols.cols-3{grid-template-columns:1fr 1fr 1fr;}
    .sort-col{border:2px solid #ead5dd;border-radius:14px;padding:8px;background:#fbf7f9;min-height:72px;}
    .sort-col h4{margin:0 0 8px;font-size:.82rem;text-align:center;color:var(--garnet-dark);}
    .sort-col .col-items{display:grid;gap:6px;}
    .sort-chip{background:#fff;color:var(--ink);border:2px solid #ead5dd;border-radius:12px;padding:9px 10px;font-weight:700;cursor:pointer;text-align:center;font-size:.92rem;min-height:0;}
    .sort-chip:hover{border-color:var(--garnet);}
    .sort-chip.sel{border-color:var(--garnet);background:#fdeef3;}
    .sort-chip.correct{border-color:var(--correct);background:#e7f5ef;color:#064b32;}
    .sort-chip.wrong{border-color:var(--wrong);background:#fff0ee;color:#6e160f;}
    @media (max-width:620px){ .sort-chip{font-size:.82rem;padding:8px 6px;} .sort-col h4{font-size:.74rem;} }

    .wordfill-wrap{display:grid;gap:14px;}
    .wf-item{background:#fbf7f9;border:1px solid #efdbe3;border-radius:14px;padding:10px 12px;}
    .wf-sentence{font-weight:600;margin-bottom:8px;line-height:1.5;}
    .wf-blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--garnet);color:var(--garnet-dark);font-weight:800;text-align:center;padding:0 4px;}
    .wf-choices{display:flex;gap:8px;flex-wrap:wrap;}
    .wf-chip{background:#faf7f8;color:var(--ink);border:2px solid #ead5dd;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:0;}
    .wf-chip:hover{border-color:var(--garnet);}
    .wf-chip.sel{background:#fdeef3;border-color:var(--garnet);color:var(--garnet-dark);}
    .wf-chip.correct{background:#e7f5ef;border-color:var(--correct);color:#064b32;}
    .wf-chip.wrong{background:#fff0ee;border-color:var(--wrong);color:#6e160f;}
    .wf-chip:disabled{cursor:default;}

    @media (max-width:620px){
      .app{padding:12px}
      header,.card{border-radius:18px}
      .stats{grid-template-columns: repeat(2,1fr)}
      .question{font-size:1.12rem}
      .controls button{flex:1 1 140px}
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="app">
    <header>
      <h1>ENGL111 Midterm Grammar Review</h1>
      <p>Practice Units 1, 2, and 3 grammar. Choose a grammar point, answer questions, and build your streak.</p>
    </header>

    <section id="setup" class="card">
      <div class="grid">
        <div>
          <label for="category">Grammar focus</label>
          <select id="category"></select>
        </div>
        <div>
          <label for="mode">Practice mode</label>
          <select id="mode">
            <option value="endless">Practice until I stop</option>
            <option value="ten">10 questions - 5 minutes</option>
            <option value="twenty">20 questions</option>
            <option value="review">Review my mistakes</option>
          </select>
        </div>
      </div>
      <div class="controls">
        <button id="startBtn">Start Practice</button>
        <button id="soundBtn" class="secondary" type="button">Sound: On</button>
        <button id="typingBtn" class="secondary" type="button">Typing: Off</button>
        <button id="resetBestBtn" class="ghost">Reset Best Score</button>
        <button id="resetProgressBtn" class="ghost">Reset Progress</button>
      </div>
      <p id="mistakesInfo" class="small"></p>
    </section>

    <section id="game" class="card hidden">
      <div class="question-meta">
        <span id="catBadge" class="badge"></span>
        <span id="timer"></span>
      </div>

      <div class="stats">
        <div class="stat"><strong id="score">0</strong><span>Score</span></div>
        <div class="stat"><strong id="streak">0</strong><span>Streak</span></div>
        <div class="stat"><strong id="best">0</strong><span>Best</span></div>
        <div class="stat"><strong id="count">0</strong><span>Answered</span></div>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" width="104" height="104" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle id="ringProgress" class="ring-fill" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-center"><strong id="ringNum">0</strong><span id="ringLabel"></span></div>
      </div>
      <div class="small" id="progressText" style="text-align:center"></div>

      <div id="questionText" class="question"></div>
      <div id="answerArea"></div>
      <div id="feedback" class="feedback"></div>

      <div class="controls">
        <button id="submitBtn">Check</button>
        <button id="nextBtn" class="secondary hidden">Next</button>
        <button id="resetItemBtn" class="ghost hidden">Reset</button>
        <button id="stopBtn" class="ghost">Stop</button>
      </div>
    </section>

    <section id="summary" class="card hidden">
      <h2>Practice Summary</h2>
      <p id="summaryText"></p>
      <div id="missedBox"></div>
      <div class="controls">
        <button id="againBtn">Practice Again</button>
        <button id="homeBtn" class="secondary">Home</button>
      </div>
    </section>
  </div>

  <script>
    const BANK = [{"id":"past-1","category":"Past Simple","type":"mcq","prompt":"Yesterday, I ___ my homework before dinner.","answer":"finished","choices":["finish","finished","finishes"],"explanation":"الماضي البسيط: الأفعال المنتظمة تنتهي بـ -ed، والأفعال الشاذة لها أشكال خاصة. في النفي والسؤال نستخدم did/didn't مع الفعل في المصدر. مع be نستخدم was/were بدون did.","cue":"finish","typeMode":"cue"},{"id":"past-2","category":"Past Simple","type":"mcq","prompt":"We ___ in a small town before we moved to the city.","answer":"lived","choices":["live","lived","living"],"explanation":"الماضي البسيط: الأفعال المنتظمة تنتهي بـ -ed، والأفعال الشاذة لها أشكال خاصة. في النفي والسؤال نستخدم did/didn't مع الفعل في المصدر. مع be نستخدم was/were بدون did.","cue":"live","typeMode":"cue"},{"id":"past-3","category":"Past Simple","type":"mcq","prompt":"She ___ carefully for the midterm exam.","answer":"studied","choices":["study","studied","studies"],"explanation":"الماضي البسيط: الأفعال المنتظمة تنتهي بـ -ed، والأفعال الشاذة لها أشكال خاصة. في النفي والسؤال نستخدم did/didn't مع الفعل في المصدر. مع be نستخدم was/were بدون did.","cue":"study","typeMode":"cue"},{"id":"past-4","category":"Past Simple","type":"mcq","prompt":"They ___ their group trip very carefully.","answer":"planned","choices":["plan","planned","plans"],"explanation":"الماضي البسيط: الأفعال المنتظمة تنتهي بـ -ed، والأفعال الشاذة لها أشكال خاصة. في النفي والسؤال نستخدم did/didn't مع الفعل في المصدر. مع be نستخدم was/were بدون did.","cue":"plan","typeMode":"cue"},{"id":"past-5","category":"Past Simple","type":"mcq","prompt":"He ___ for a scholarship last year.","answer":"applied","choices":["apply","applied","applyed"],"explanation":"الماضي البسيط: الأفعال المنتظمة تنتهي بـ -ed، والأفعال الشاذة لها أشكال خاصة. في النفي والسؤال نستخدم did/didn't مع الفعل في المصدر. مع be نستخدم was/were بدون did.","cue":"apply","typeMode":"cue"},{"id":"past-6","category":"Past Simple","type":"mcq","prompt":"We ___ at the hotel for three n     let audioCtx = null;
    function ensureCtx(){
      if(!audioCtx){
        try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }

      if(audioCtx && audioCtx.state === "suspended"){ try{ audioCtx.resume(); }catch(e){} }
      return audioCtx;
    }
    // iOS/Chrome-mobile need the audio context unlocked inside a user gesture (tap)
    function unlockAudio(){
      const ctx = ensureCtx();
      if(!ctx) return;
      try{
        const b = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = b; src.connect(ctx.destination); src.start(0);
      }catch(e){}
    }
    function sfx(kind){
      if(!soundOn) return;
      const ctx = ensureCtx();
      if(!ctx) return;
      try{
        const now = ctx.currentTime + 0.03;
        const beep = (freqA, freqB, type, t0, dur, vol) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = type; o.frequency.setValueAtTime(freqA, t0);
          if(freqB) o.frequency.exponentialRampToValueAtTime(freqB, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.start(t0); o.stop(t0 + dur + 0.02);
        };
        if(kind === "correct"){ beep(660, 990, "sine", now, 0.18, 0.32); }
        else if(kind === "wrong"){ beep(240, 120, "triangle", now, 0.30, 0.28); }
        else if(kind === "win"){ [523,659,784,1047].forEach((f,i)=>beep(f, null, "sine", now + i*0.09, 0.2, 0.3)); }
      }catch(e){}
    }

    function launchConfetti(){
      if(!cctx) return;
      const W = els.confetti.width = window.innerWidth;
      const H = els.confetti.height = window.innerHeight;
      els.confetti.style.display = "block";
      const colors = ["#8A1538","#c94d73","#e8b53e","#2f9e6f","#3a6ea5","#e8e1da"];
      const parts = [];
      for(let i=0;i<80;i++){
        parts.push({ x:Math.random()*W, y:-20-Math.random()*H*0.3, r:4+Math.random()*6,
          c:colors[i%colors.length], vy:2+Math.random()*3.5, vx:-1.6+Math.random()*3.2,
          rot:Math.random()*6.28, vr:-0.2+Math.random()*0.4 });
      }
      cancelAnimationFrame(confettiRAF);
      const start = performance.now();
      (function frame(now){
        const t = now - start;
        cctx.clearRect(0,0,W,H);
        parts.forEach(p=>{
          p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.rot+=p.vr;
          cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
          cctx.fillStyle=p.c; cctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.65); cctx.restore();
        });
        if(t < 1500){ confettiRAF = requestAnimationFrame(frame); }
        else { cctx.clearRect(0,0,W,H); els.confetti.style.display="none"; }
      })(start);
    }

    const SR_KEY = "engl111MidSR";
    function loadSR(){ try{ return JSON.parse(store.get(SR_KEY)) || {}; }catch(e){ return {}; } }
    function saveSR(sr){ try{ store.set(SR_KEY, JSON.stringify(sr)); }catch(e){} }
    function boxOf(sr, id){ return (sr[id] && sr[id].box) ? sr[id].box : 1; }
    function recordResult(id, ok){
      const sr = loadSR();
      const rec = sr[id] || { box:1, right:0, wrong:0 };
      if(ok){ rec.box = Math.min(5, (rec.box||1) + 1); rec.right = (rec.right||0) + 1; }
      else  { rec.box = 1; rec.wrong = (rec.wrong||0) + 1; }
      rec.last = Date.now(); sr[id] = rec; saveSR(sr);

    function inFocus(q, cat){ return cat === "All Grammar" || q.category === cat; }

    function weightedOrder(pool){
      const sr = loadSR();
      return pool.map(q => {
        const w = 6 - boxOf(sr, q.id);      // box1 -> 5 (seen most), box5 -> 1 (seen least)

      }).sort((a,b) => a.k - b.k).map(o => o.q);

        if(!pool.length){ alert("No saved mistakes to review in this focus yet. Try a round first!"); return; }
        pool = shuffle(pool);
      } else {
        pool = cat === "All Grammar" ? BANK.slice() : BANK.filter(q => q.category === cat);
        pool = weightedOrder(pool);
      }
      const max = mode === "ten" ? 10 : mode === "twenty" ? 20 : mode === "review" ? pool.length : null;
      session = {
        questions:pool, index:0, score:0, streak:0, answered:0, checked:false,
        max, timer:null, timeLeft: mode==="ten" ? 300 : 0, mode, current:null, missed:[]
      };
      els.setup.classList.add("hidden");
      els.summary.classList.add("hidden");
      els.game.classList.remove("hidden");
      els.score.textContent = "0";
      els.best.textContent = getBest();
      if(mode === "ten") startTimer();
      renderQuestion();
    }

    function startTimer(){
      clearInterval(session.timer);
      session.timer = setInterval(()=>{
        session.timeLeft--;
        els.timer.textContent = `Time: ${formatTime(session.timeLeft)}`;
        if(session.timeLeft <= 0) finish("Time is up.");
      },1000);
    }
    function formatTime(sec){ const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,"0")}`; }

    function setRing(fraction, num, label){
      const C = 326.7;
      els.ringProgress.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, fraction)));
      els.ringNum.textContent = num;
      els.ringLabel.textContent = label;
    }
    function updateStats(){
      els.streak.textContent = session.streak;
      els.best.textContent = Math.max(getBest(), session.score);
      els.count.textContent = session.answered;
      els.timer.textContent = session.mode === "ten" ? `Time: ${formatTime(session.timeLeft)}` : "";
      if(session.max){
        setRing(session.answered / session.max, session.answered, "of " + session.max);
        els.progressText.textContent = `${session.answered} of ${session.max}`;
      } else {
        const into = session.streak % 10;
        setRing(session.streak === 0 ? 0 : (into === 0 ? 1 : into/10), session.streak, "streak");
        els.progressText.textContent = "";
      }
    }

    /* ---------- rendering ---------- */
    function renderQuestion(){
      session.checked = false;
      orderState = null; matchState = null; wordfillState = null; sortState = null;
      els.feedback.className = "feedback";
      els.feedback.style.display = "none";
      els.nextBtn.classList.add("hidden");
      els.resetItemBtn.classList.add("hidden");
      els.submitBtn.classList.remove("hidden");
      els.answerArea.innerHTML = "";

      if(session.index >= session.questions.length){
        if(session.mode === "review" || session.max){ finish(); return; }
        session.questions = shuffle(session.questions);
        session.index = 0;
      }
      session.current = session.questions[session.index++];
      const q = session.current;
      els.catBadge.textContent = q.category;

      if(q.type === "order"){ renderOrder(q); }
      else if(q.type === "match"){ renderMatch(q); }
      else if(q.type === "wordfill"){ renderWordfill(q); }
      else if(q.type === "sort"){ renderSort(q); }
      else { renderMcq(q); }

      updateStats();
    }

    function canTypeItem(q){ return typingMode && q.type === "mcq" && (q.typeMode === "cue" || q.typeMode === "bare"); }

    function renderMcq(q){
      if(canTypeItem(q)){
        els.questionText.textContent = (q.typeMode === "cue" && q.cue)
          ? q.prompt.replace("___", "___ (" + q.cue + ")")
          : q.prompt;
        const input = document.createElement("input");
        input.type = "text"; input.className = "type-input"; input.id = "typeInput";
        input.autocomplete = "off"; input.autocapitalize = "off"; input.spellcheck = false;
        input.setAttribute("autocorrect", "off");
        input.placeholder = "Type the missing word…";
        els.answerArea.appendChild(input);
        setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 0);
        return;
      }
      els.questionText.textContent = q.prompt;
      const wrap = document.createElement("div");
      wrap.className = "choices";
      shuffle(q.choices).forEach(choice=>{
        const btn = document.createElement("button");
        btn.className = "choice"; btn.textContent = choice;
        btn.onclick = () => {
          if(session.checked) return;
          [...wrap.children].forEach(b=>{ b.dataset.selected="false"; b.classList.remove("sel"); });
          btn.dataset.selected = "true"; btn.classList.add("sel");
        };
        wrap.appendChild(btn);
      });
      els.answerArea.appendChild(wrap);
    }

    function renderOrder(q){
      els.questionText.textContent = q.prompt;
      els.resetItemBtn.classList.remove("hidden");
      orderState = { slots:new Array(q.steps.length).fill(null), slotEls:[], poolEl:null };
      const wrap = document.createElement("div"); wrap.className = "order-wrap";

      const slotBox = document.createElement("div");
      slotBox.innerHTML = `<div class="section-label">Put the steps in order:</div>`;
      const slotList = document.createElement("div"); slotList.className = "slot-list";
      for(let i=0;i<q.steps.length;i++){
        const slot = document.createElement("div"); slot.className = "order-slot";
        slot.innerHTML = `<span class="num">${i+1}</span><span class="empty">tap a step below…</span>`;
        slot.onclick = () => {
          if(session.checked) return;
          const val = orderState.slots[i];
          if(val){ orderState.slots[i] = null; renderOrderState(q); }
        };
        orderState.slotEls.push(slot);
        slotList.appendChild(slot);
      }
      slotBox.appendChild(slotList);

      const poolBox = document.createElement("div");
      poolBox.innerHTML = `<div class="section-label">Steps:</div>`;
      const poolList = document.createElement("div"); poolList.className = "pool-list";
      orderState.poolEl = poolList;
      poolBox.appendChild(poolList);

      wrap.appendChild(slotBox); wrap.appendChild(poolBox);
      els.answerArea.appendChild(wrap);
      renderOrderState(q);
    }
    function renderOrderState(q){
      // slots
      orderState.slots.forEach((val, i)=>{
        const slot = orderState.slotEls[i];
        slot.className = "order-slot";
        slot.innerHTML = `<span class="num">${i+1}</span>` +
          (val ? `<span class="filled">${val}</span>` : `<span class="empty">tap a step below…</span>`);
        slot.onclick = () => { if(session.checked) return; if(orderState.slots[i]){ orderState.slots[i]=null; renderOrderState(q); } };
      });
      // pool = steps not placed
      const placed = new Set(orderState.slots.filter(Boolean));
      orderState.poolEl.innerHTML = "";
      shuffle(q.steps.filter(s=>!placed.has(s))).forEach(step=>{
        const b = document.createElement("button"); b.className = "pool-item"; b.textContent = step;
        b.onclick = () => {
          if(session.checked) return;
          const empty = orderState.slots.indexOf(null);
          if(empty === -1) return;
          orderState.slots[empty] = step; renderOrderState(q);
        };
        orderState.poolEl.appendChild(b);
      });
    }

    function renderMatch(q){
      els.questionText.textContent = q.prompt;
      els.resetItemBtn.classList.remove("hidden");
      matchState = { chosen:{}, selLeft:null, leftEls:[], rightEls:[], rightUsed:{} };
      const lefts = q.pairs.map((p,i)=>({ text:p[0], i }));
      const rights = shuffle(q.pairs.map(p=>p[1]));

      const wrap = document.createElement("div"); wrap.className = "match-wrap";
      const leftCol = document.createElement("div"); leftCol.className = "match-col";
      const rightCol = document.createElement("div"); rightCol.className = "match-col";

      lefts.forEach(L=>{
        const el = document.createElement("div"); el.className = "match-item match-left"; el.textContent = L.text;
        el.dataset.i = L.i;
        el.onclick = () => {
          if(session.checked || matchState.chosen[L.i] !== undefined) return;
          matchState.selLeft = L.i;
          matchState.leftEls.forEach(e=>e.classList.remove("sel"));
          el.classList.add("sel");
        };
        matchState.leftEls.push(el); leftCol.appendChild(el);
      });
      rights.forEach(prep=>{
        const el = document.createElement("div"); el.className = "match-item"; el.textContent = prep; el.dataset.prep = prep;
        el.onclick = () => {
          if(session.checked || matchState.rightUsed[prep]) return;
          if(matchState.selLeft === null) return;
          const li = matchState.selLeft;
          matchState.chosen[li] = prep; matchState.rightUsed[prep] = li;
          const n = Object.keys(matchState.chosen).length;
          const leftEl = matchState.leftEls.find(e=>Number(e.dataset.i) === li);
          leftEl.classList.remove("sel"); leftEl.classList.add("done");
          leftEl.insertAdjacentHTML("beforeend", `<span class="tag">${n}</span>`);
          el.classList.add("done");
          el.innerHTML = `${prep}<span class="tag">${n}</span>`;
          matchState.selLeft = null;
        };
        matchState.rightEls.push(el); rightCol.appendChild(el);
      });
      wrap.appendChild(leftCol); wrap.appendChild(rightCol);
      els.answerArea.appendChild(wrap);
    }

    function renderWordfill(q){
      els.questionText.textContent = q.prompt;
      els.resetItemBtn.classList.remove("hidden");
      wordfillState = { selections:new Array(q.blanks.length).fill(null), blankEls:[], chipEls:[] };
      const wrap = document.createElement("div"); wrap.className = "wordfill-wrap";
      q.blanks.forEach((b, i)=>{
        const item = document.createElement("div"); item.className = "wf-item";
        const sent = document.createElement("div"); sent.className = "wf-sentence";
        const parts = b.sentence.split("___");
        sent.append(document.createTextNode(parts[0] || ""));
        const blank = document.createElement("span"); blank.className = "wf-blank"; blank.textContent = "?";
        sent.append(blank);
        sent.append(document.createTextNode(parts[1] || ""));
        const choices = document.createElement("div"); choices.className = "wf-choices";
        const chips = [];
        shuffle(b.choices).forEach(word=>{
          const chip = document.createElement("button"); chip.className = "wf-chip"; chip.textContent = word;
          chip.onclick = () => {
            if(session.checked) return;
            wordfillState.selections[i] = word; blank.textContent = word;
            chips.forEach(c=>c.classList.remove("sel")); chip.classList.add("sel");
          };
          chips.push(chip); choices.appendChild(chip);
        });
        wordfillState.blankEls.push(blank); wordfillState.chipEls.push(chips);
        item.appendChild(sent); item.appendChild(choices); wrap.appendChild(item);
      });
      els.answerArea.appendChild(wrap);
    }
    function markWordfill(q){
      q.blanks.forEach((b, i)=>{
        const chosen = wordfillState.selections[i];
        const right = chosen === b.answer;
        wordfillState.chipEls[i].forEach(chip=>{
          chip.disabled = true;
          if(chip.textContent === chosen) chip.classList.add(right ? "correct" : "wrong");
        });
      });
    }

    function renderSort(q){
      els.questionText.textContent = q.prompt;
      els.resetItemBtn.classList.remove("hidden");
      sortState = { place: q.items.map(()=>null), sel: null, poolEl: null, colEls: [] };
      const wrap = document.createElement("div"); wrap.className = "sort-wrap";
      const hint = document.createElement("div"); hint.className = "sort-hint"; hint.textContent = "Tap a word, then tap a column.";
      const pool = document.createElement("div"); pool.className = "sort-pool"; sortState.poolEl = pool;
      const cols = document.createElement("div"); cols.className = "sort-cols cols-" + q.columns.length;
      q.columns.forEach((label, ci)=>{
        const col = document.createElement("div"); col.className = "sort-col";
        const h = document.createElement("h4"); h.textContent = label; col.appendChild(h);
        const box = document.createElement("div"); box.className = "col-items"; col.appendChild(box);
        col.onclick = () => {
          if(session.checked || sortState.sel === null) return;
          sortState.place[sortState.sel] = ci; sortState.sel = null; renderSortState(q);
        };
        sortState.colEls.push(box);
        cols.appendChild(col);
      });
      wrap.appendChild(hint); wrap.appendChild(pool); wrap.appendChild(cols);
      els.answerArea.appendChild(wrap);
      renderSortState(q);
    }
    function renderSortState(q){
      sortState.poolEl.innerHTML = "";
      sortState.colEls.forEach(b=>b.innerHTML = "");
      q.items.forEach((it, i)=>{
        const where = sortState.place[i];
        const chip = document.createElement("button"); chip.className = "sort-chip"; chip.textContent = it[0];
        if(session.checked){
          chip.disabled = true;
          if(where !== null) chip.classList.add(it[1] === where ? "correct" : "wrong");
          (where === null ? sortState.poolEl : sortState.colEls[where]).appendChild(chip);
          return;
        }
        if(where === null){
          if(sortState.sel === i) chip.classList.add("sel");
          chip.onclick = () => { if(session.checked) return; sortState.sel = (sortState.sel === i ? null : i); renderSortState(q); };
          sortState.poolEl.appendChild(chip);
        } else {
          chip.onclick = () => { if(session.checked) return; sortState.place[i] = null; sortState.sel = null; renderSortState(q); };
          sortState.colEls[where].appendChild(chip);
        }
      });
    }

    function resetCurrentItem(){
      if(session.checked) return;
      const q = session.current;
      if(q.type === "order"){ orderState.slots = new Array(q.steps.length).fill(null); renderOrderState(q); }
      else if(q.type === "match"){ renderMatch(q); }
      else if(q.type === "wordfill"){ renderWordfill(q); }
      else if(q.type === "sort"){ sortState.place = q.items.map(()=>null); sortState.sel = null; renderSortState(q); }
    }

    /* ---------- checking ---------- */
    function evaluateCurrent(){
      const q = session.current;
      if(q.type === "order"){
        if(orderState.slots.includes(null)) return { empty:true };
        return { ok: orderState.slots.every((s,i)=>s === q.steps[i]) };
      }
      if(q.type === "match"){
        if(Object.keys(matchState.chosen).length < q.pairs.length) return { empty:true };
        return { ok: q.pairs.every((p,i)=> matchState.chosen[i] === p[1]) };
      }
      if(q.type === "wordfill"){
        if(wordfillState.selections.includes(null)) return { empty:true };
        return { ok: q.blanks.every((b,i)=> wordfillState.selections[i] === b.answer) };
      }
      if(q.type === "sort"){
        if(sortState.place.includes(null)) return { empty:true };
        return { ok: q.items.every((it,i)=> sortState.place[i] === it[1]) };
      }
      if(canTypeItem(q)){
        const inp = document.getElementById("typeInput");
        const val = inp ? inp.value.trim() : "";
        if(!val) return { empty:true };
        return { ok: isCorrect(val, q.answer), user:val };
      }
      const sel = [...document.querySelectorAll(".choice")].find(b=>b.dataset.selected === "true");
      if(!sel) return { empty:true };
      return { ok: isCorrect(sel.textContent, q.answer), user:sel.textContent };
    }

    function markOrder(q){
      orderState.slots.forEach((s,i)=>{
        orderState.slotEls[i].classList.remove("correct","wrong");
        orderState.slotEls[i].classList.add(s === q.steps[i] ? "correct" : "wrong");
      });
    }
    function markMatch(q){
      q.pairs.forEach((p,i)=>{
        const ok = matchState.chosen[i] === p[1];
        const leftEl = matchState.leftEls.find(e=>Number(e.dataset.i) === i);
        if(leftEl) leftEl.classList.add(ok ? "correct" : "wrong");
        const chosenPrep = matchState.chosen[i];
        const rightEl = matchState.rightEls.find(e=>e.dataset.prep === chosenPrep && !e.dataset.marked);
        if(rightEl){ rightEl.dataset.marked = "1"; rightEl.classList.add(ok ? "correct" : "wrong"); }
      });
    }

    function checkAnswer(){
      if(session.checked) return;
      const q = session.current;
      const res = evaluateCurrent();
      if(res.empty){
        els.feedback.className = "feedback wrong";
        els.feedback.style.display = "block";
        els.feedback.textContent = q.type === "sort" ? "Sort every word first." :
          q.type === "mcq" ? (canTypeItem(q) ? "Type your answer first." : "Choose an answer first.") :
          q.type === "order" ? "Fill every step first." :
          q.type === "wordfill" ? "Choose a word for every step first." : "Match every item first.";
        return;
      }
      session.checked = true;
      session.answered++;
      els.feedback.style.display = "block";
      recordResult(q.id, res.ok);
      const prevScore = session.score;

      if(res.ok){
        session.score++; session.streak++;
        const milestone = session.streak > 0 && session.streak % 10 === 0;
        els.feedback.className = "feedback correct";
        els.feedback.innerHTML = `<div class="praise"><span class="fb-mark">✓</span> <span dir="auto">${randomPraise()}</span></div>`;
        if(milestone){ sfx("win"); buzz([15,40,15,40,60]); launchConfetti(); }
        else { sfx("correct"); buzz(25); }
        animateNumber(els.score, prevScore, session.score);
      } else {
        session.streak = 0;
        session.missed.push(q);
        els.feedback.className = "feedback wrong";
        els.feedback.innerHTML = `<div class="fb-line"><span class="fb-mark">✗</span></div><div class="arabic" dir="rtl">${isolateLatin(q.explanation)}</div>`;
        sfx("wrong"); buzz([30,40,30]);
      }
      if(q.type === "mcq"){
        if(canTypeItem(q)){
          const inp = document.getElementById("typeInput");
          if(inp){ inp.classList.add(res.ok ? "correct" : "wrong"); inp.disabled = true; }
        } else {
          const sel = [...document.querySelectorAll(".choice")].find(b=>b.dataset.selected === "true");
          if(sel){ sel.classList.remove("sel"); sel.classList.add(res.ok ? "correct" : "wrong"); }
          [...document.querySelectorAll(".choice")].forEach(b=>b.disabled = true);
        }
      }
      if(q.type === "order") markOrder(q);
      if(q.type === "match") markMatch(q);
      if(q.type === "wordfill") markWordfill(q);
      if(q.type === "sort") renderSortState(q);

      setBest(session.score);
      updateStats();

      els.submitBtn.classList.add("hidden");
      els.resetItemBtn.classList.add("hidden");
      const last = session.max && session.answered >= session.max;
      els.nextBtn.textContent = last ? "See Summary" : "Next";
      els.nextBtn.classList.remove("hidden");
      els.nextBtn.onclick = last ? () => finish() : renderQuestion;
    }

    function finish(reason=""){
      clearInterval(session.timer);
      setBest(session.score);
      els.game.classList.add("hidden");
      els.summary.classList.remove("hidden");
      const total = session.answered || 0;
      const percent = total ? Math.round((session.score/total)*100) : 0;
      const perfect = total > 0 && session.score === total;
      els.summaryText.innerHTML =
        `${reason ? reason + "<br>" : ""}<strong>Score:</strong> ${session.score}/${total} (${percent}%). ` +
        `<strong>Best for this focus:</strong> ${getBest()}.` +
        (perfect ? `<br><strong>Perfect round! 🎉</strong>` : "");

      if(perfect){ sfx("win"); launchConfetti(); }

      if(session.missed.length){
        const unique = [];
        const seen = new Set();
        session.missed.slice().reverse().forEach(q=>{ if(!seen.has(q.id)){ seen.add(q.id); unique.push(q); } });
        els.missedBox.innerHTML = `<h3>Review these:</h3><ul class="review-list">${
          unique.slice(0,6).map(q=>`<li>${q.prompt}</li>`).join("")
        }</ul>`;
      } else {
        els.missedBox.innerHTML = `<p>Great work. No missed questions in this round.</p>`;
      }
    }

    /* ---------- bindings ---------- */
    els.startBtn.onclick = () => { unlockAudio(); start(); };
    els.submitBtn.onclick = () => { ensureCtx(); checkAnswer(); };
    els.resetItemBtn.onclick = resetCurrentItem;
    els.stopBtn.onclick = () => finish("Practice stopped.");
    els.againBtn.onclick = start;
    els.homeBtn.onclick = () => {
      clearInterval(session.timer);
      els.summary.classList.add("hidden");
      els.game.classList.add("hidden");
      els.setup.classList.remove("hidden");
      updateMistakesInfo();
    };
    els.soundBtn.onclick = () => {
      soundOn = !soundOn;
      store.set("engl111MidSound", soundOn ? "on" : "off");
      refreshSoundBtn();
      if(soundOn){ unlockAudio(); sfx("correct"); }
    };
    els.typingBtn.onclick = () => {
      typingMode = !typingMode;
      store.set("engl111MidType", typingMode ? "on" : "off");
      refreshTypingBtn();
    };
    els.resetBestBtn.onclick = () => {
      store.remove(bestKey());
      alert("Best score reset for this grammar focus.");
    };
    els.resetProgressBtn.onclick = () => {
      const cat = categorySelect.value;
      if(!confirm(`Clear saved progress and mistakes for "${cat}"?`)) return;
      const sr = loadSR();
      BANK.forEach(q=>{ if(inFocus(q, cat)) delete sr[q.id]; });
      saveSR(sr);
      updateMistakesInfo();
    };
    categorySelect.onchange = updateMistakesInfo;
    document.addEventListener("keydown", e=>{
      if(els.game.classList.contains("hidden")) return;
      if(e.key === "Enter"){
        if(!els.nextBtn.classList.contains("hidden")) els.nextBtn.click();
        else els.submitBtn.click();
      }
    });

    if(!BANK.some(q=>q.typeMode === "cue" || q.typeMode === "bare")) els.typingBtn.classList.add("hidden");
    updateMistakesInfo();
  </script>
</body>
</html>
